; espnow_probe -- two ESP32s, ESP-NOW, and nothing else. See src/main.c.
;
; The point is what is ABSENT: no Bluetooth, no SD card, no HTTP server, no
; LVGL, no sockets, no Reticulum. The real firmware runs all of those through
; one radio and cannot answer whether two stations can hold a manually-set
; channel at all -- this can.
;
; Both boards run the same source. Drive them over serial:
;   dongle: ~/.platformio/penv/bin/pio run -e tdongle -t upload
;   m5:     ~/.platformio/penv/bin/pio run -e m5stack -t upload
[env]
platform = espressif32@6.7.0
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv

[env:tdongle]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_upload.flash_size = 16MB
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
; The T-Dongle-S3 exposes no UART pins, so its console must be the native
; USB-JTAG -- see sdkconfig.defaults, where the symbol is set. On the M5Stack
; (an original ESP32, no USB-JTAG hardware) that symbol does not exist and the
; console stays on UART0 through the CP2104.
; Bluetooth is dongle-only -- see sdkconfig.defaults.tdongle for why.
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.tdongle"
build_flags = -DPROBE_TDONGLE

[env:m5stack]
board = m5stack-core-esp32
board_build.mcu = esp32
board_upload.flash_size = 16MB
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_flags = -DPROBE_M5STACK

; XPRS station on an M5Stack Core — the second ESP-NOW node.
;
; This board is an ORIGINAL ESP32 (D0WDQ6), which has no BLE5 extended
; advertising, so it can never join the BLE5 mesh plane the T-Dongle uses
; (docs/esp32.md, "Radio capability per chip"). What it does have is ESP-NOW and
; WiFi, which is exactly what is being tested: two ESP32s hearing each other on
; link:espnow with no access point between them.
;
; It shares the communication components with the dongle by symlink, the same
; arrangement rns_ble5 uses — geogram_xprs, geogram_xprsbearer, geogram_xprsnow,
; geogram_xprslan, geogram_wifi.
;
;   build:   ~/.platformio/penv/bin/pio run
;   flash:   ~/.platformio/penv/bin/pio run -t upload
;   monitor: ~/.platformio/penv/bin/pio device monitor -b 115200 -p /dev/ttyUSB0
;
; The board is a CP2104 at /dev/ttyUSB0 — the T-Dongle is native USB-JTAG at
; /dev/ttyACM0, so the two never collide.
[env:m5stack]
platform = espressif32@6.7.0
board = m5stack-core-esp32
framework = espidf
monitor_speed = 115200
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
